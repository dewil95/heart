name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Go core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Format, vet, test
        working-directory: core
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt needed: $unformatted"; exit 1; fi
          go vet ./...
          go test -race ./...

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the APK as a release
    concurrency:
      group: android-release # one release update at a time
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the Go core (gomobile bind)
        run: scripts/build-core.sh
      - name: Build and lint the app
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: net-merge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      # Artifacts only show on the run page, signed in, on the website. A release shows on the
      # repo's Releases page (also in the GitHub app) and the APK downloads directly.
      - name: Publish the APK as the "android-latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk net-merge-debug.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest net-merge-debug.apk \
            --target "$GITHUB_SHA" --latest \
            --title "net-merge for Android (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Early prototype, not yet tested on many phones.

          Install: download net-merge-debug.apk below on your phone, open it and allow installing from this source. Then open net-merge, tap Start merging and accept the VPN request.

          Every build is signed with the same key, so a newer one installs over this one."

  # Smoke test on an emulator: install, start merging, open every screen. Screenshots and the app's
  # log go to the "android-screenshots" pre-release, so they can be looked at without signing in.
  screenshots:
    name: Emulator screenshots
    needs: apk
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: android-screenshots
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: net-merge-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: scripts/emulator-screenshots.sh apk/app-debug.apk shots
      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls shots
          gh release delete android-screenshots --yes --cleanup-tag || true
          gh release create android-screenshots shots/* \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Emulator screenshots (CI)" \
            --notes "Screens of the build at ${GITHUB_SHA::7} on an Android 14 emulator, plus the app's log."
